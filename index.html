<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitul Tailor | IT Operations Leader</title>
    <link rel="icon" type="image/png" href="favicon.png?v=60">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; background-color: #0c0c0e !important; font-family: 'Plus Jakarta Sans', sans-serif; color: #1a1a1a; overflow-x: hidden; }
        
        /* 1. THE IMAGE LAYER */
        #fixed-bg-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10;
            background-image: url('bg_mt_ws.jpg') !important;
            background-size: cover !important; background-position: center !important;
            background-repeat: no-repeat !important; 
            filter: blur(10px) brightness(0.8) !important;
            transform: scale(1.05);
        }

        /* 2. THE VIBRANT OVERLAY */
        .vibrant-glass-wash {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -5;
            background: radial-gradient(circle at 5% 5%, rgba(59, 130, 246, 0.2), transparent 40%),
                        radial-gradient(circle at 95% 95%, rgba(139, 92, 246, 0.2), transparent 40%),
                        rgba(255, 255, 255, 0.15);
        }

        /* 3. SYNCED CLIPBOARDS (3rd Skill Added) */
        .clipboard-nav {
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer; position: relative;
        }
        
        .clipboard-card {
            width: 85px; height: 105px;
            background: #ffffff; border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.8);
        }

        .clipboard-card::before {
            content: ''; position: absolute; top: 10px;
            width: 32px; height: 6px; background: #f1f5f9; border-radius: 3px;
        }

        .clipboard-nav:hover {
            transform: translateY(-15px) scale(1.1);
            filter: drop-shadow(0 20px 40px rgba(59, 130, 246, 0.25));
        }

        .clip-text {
            font-size: 0.55rem; font-weight: 800; color: #1e293b;
            letter-spacing: 0.12em; text-transform: uppercase; margin-top: 12px;
        }
        
        .hero-title { font-size: 8rem; line-height: 0.82; font-weight: 900; letter-spacing: -0.04em; }

        /* PULSE ANIMATION */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .btn-pulse {
            background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%); color: #fff;
            padding: 1.25rem 3.5rem; border-radius: 9999px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.15em; font-size: 0.7rem; transition: 0.3s ease;
            animation: pulse-glow 2s infinite;
        }

        /* SCROLL TOP BUTTON */
        #scrollTopBtn {
            position: fixed; bottom: 30px; right: 30px;
            width: 45px; height: 45px; background: white;
            border-radius: 12px; display: none; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 100;
            border: 1px solid rgba(255,255,255,0.8); cursor: pointer;
            transition: 0.3s;
        }
        #scrollTopBtn:hover { transform: translateY(-5px); background: #f8fafc; }

        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); border-radius: 3rem; border: 1px solid rgba(255,255,255,0.4); }
    </style>
</head>
