            letter-spacing: 0.15em; font-size: 0.65rem; animation: pulse-glow 2s infinite;

        .hero-title { font-size: 8.5rem; line-height: 0.82; font-weight: 900; letter-spacing: -0.04em; }

            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; margin: 0 auto;
