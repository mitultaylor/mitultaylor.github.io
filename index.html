<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitul Tailor | IT Operations Leader</title>
    <link rel="icon" type="image/png" href="favicon.png?v=57">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; background-color: #0c0c0e !important; font-family: 'Plus Jakarta Sans', sans-serif; color: #1a1a1a; overflow-x: hidden; }
        
        /* 1. THE IMAGE LAYER - Reduced blur for more detail */
        #fixed-bg-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10;
            background-image: url('bg_mt_ws.jpg') !important;
            background-size: cover !important; background-position: center !important;
            background-repeat: no-repeat !important; filter: blur(15px) brightness(0.75) !important;
            transform: scale(1.05);
        }

        /* 2. THE VIBRANT OVERLAY - Set to 0.25 transparency for maximum visibility */
        .vibrant-glass-wash {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -5;
            background: radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.25), transparent 50%),
                        radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.25), transparent 50%),
                        rgba(255, 255, 255, 0.25); /* Ultra-transparent frost */
        }

        /* 3. SYNCED CLIPBOARD DESIGN */
        .clipboard-nav {
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            position: relative;
        }
        
        .clipboard-card {
            width: 90px; height: 110px;
            background: #ffffff;
            border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.03);
        }

        /* The Clipboard "Clip" Handle */
        .clipboard-card::before {
            content: '';
            position: absolute; top: 8px;
            width: 35px; height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
        }

        .clipboard-nav:hover {
            transform: translateY(-20px) scale(1.1);
            filter: drop-shadow(0 25px 50px rgba(59, 130, 246, 0.2));
        }

        .clip-text {
            font-size: 0.6rem; font-weight: 900; color: #64748b;
            letter-spacing: 0.1em; text-transform: uppercase;
            margin-top: 15px;
        }
        
        .btn-action {
            background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%); color: #fff;
            padding: 1.25rem 3.5rem; border-radius: 9999px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.15em; font-size: 0.7rem; transition: 0.3s; 
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.4);
        }

        .hero-title { font-size: 8rem; line-height: 0.85; font-weight: 900; letter-spacing: -0.05em; }
    </style>
</head>

        </div>
    </nav>
